<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Streak - Daily Rewards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay">
        <div class="modal">
            <button class="close-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="6" y1="18" x2="18" y2="6"></line>
                </svg>
            </button>

            <div class="header-banner">
                <div class="banner-left"></div>
                <div class="banner-center">
                    <span class="banner-text">DAY STREAK</span>
                </div>
                <div class="banner-right"></div>
            </div>

            <div class="rewards-container">
                <div class="rewards-grid">
                    <div class="day-card completed">
                        <div class="day-label">DAY 1</div>
                        <div class="card-content">
                            <div class="stamp-overlay">
                                <div class="stamp">
                                    <div class="stamp-inner">
                                        <span class="stamp-text-top">DAILY</span>
                                        <span class="stamp-text-main">CLEAR</span>
                                        <span class="stamp-text-bottom">REWARD</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="reward-count completed-count">1</div>
                    </div>

                    <div class="day-card current">
                        <div class="day-label">DAY 2</div>
                        <div class="card-content">
                            <div class="lightning-icon green">
                                <svg viewBox="0 0 40 60" class="bolt">
                                    <polygon points="25,0 8,28 20,28 15,60 35,25 22,25"/>
                                </svg>
                            </div>
                        </div>
                        <div class="reward-count">1</div>
                        <div class="sparkles">
                            <div class="sparkle s1">✦</div>
                            <div class="sparkle s2">✦</div>
                            <div class="sparkle s3">✦</div>
                            <div class="sparkle s4">✦</div>
                        </div>
                    </div>

                    <div class="day-card">
                        <div class="day-label">DAY 3</div>
                        <div class="card-content">
                            <div class="coins-icon double">
                                <div class="coin c1"></div>
                                <div class="coin c2"></div>
                            </div>
                        </div>
                        <div class="reward-count">3</div>
                    </div>

                    <div class="day-card">
                        <div class="day-label">DAY 4</div>
                        <div class="card-content">
                            <div class="lightning-icon yellow">
                                <svg viewBox="0 0 40 60" class="bolt">
                                    <polygon points="25,0 8,28 20,28 15,60 35,25 22,25"/>
                                </svg>
                            </div>
                        </div>
                        <div class="reward-count">2</div>
                    </div>

                    <div class="day-card">
                        <div class="day-label">DAY 5</div>
                        <div class="card-content">
                            <div class="coins-icon single">
                                <div class="coin"></div>
                            </div>
                        </div>
                        <div class="reward-count">2</div>
                    </div>

                    <div class="day-card">
                        <div class="day-label">DAY 6</div>
                        <div class="card-content">
                            <div class="lightning-icon yellow">
                                <svg viewBox="0 0 40 60" class="bolt">
                                    <polygon points="25,0 8,28 20,28 15,60 35,25 22,25"/>
                                </svg>
                            </div>
                        </div>
                        <div class="reward-count">2</div>
                    </div>

                    <div class="day-card mega-bonus">
                        <div class="day-label mega-label">DAY 7</div>
                        <div class="card-content">
                            <div class="mega-reward">
                                <div class="mega-star">★</div>
                                <div class="mega-coins">
                                    <div class="coin c1"></div>
                                    <div class="coin c2"></div>
                                    <div class="coin c3"></div>
                                </div>
                            </div>
                        </div>
                        <div class="mega-text">MEGA BONUS</div>
                        <div class="mega-sparkles">
                            <div class="mega-sparkle ms1">✦</div>
                            <div class="mega-sparkle ms2">✦</div>
                            <div class="mega-sparkle ms3">✦</div>
                            <div class="mega-sparkle ms4">✦</div>
                        </div>
                    </div>
                </div>
            </div>

            <button class="claim-btn">Claim</button>
        </div>
    </div>
</body>
</html>
